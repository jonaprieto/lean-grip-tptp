name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Cache elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake dependencies
        uses: actions/cache@v6
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lakefile.lean', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      - name: Configure private ecosystem access
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
        run: test -n "$GH_TOKEN"
      - name: Configure private ecosystem URL
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          build-args: "TPTP TPTP.Properties demo tests conformance corpus"
      - name: Materialize properties for axiom audit
        run: |
          lake clean
          lake build TPTP.Properties.Basic
          test -f .lake/build/lib/lean/TPTP/Properties/Basic.olean
      - uses: jonaprieto/precommit-lean/.github/actions/precommit@v0.1.5
        with:
          token: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
          hooks: lean-axioms
      - name: Require total parser definitions
        run: '! rg -n "\\bpartial\\s+(def|theorem)\\b" TPTP/Parse.lean TPTP/FirstOrder/Parse.lean TPTP/FOF/Parse.lean TPTP/CNF/Parse.lean TPTP/TFF/Parse.lean'
      - name: Run tests
        run: lake exe tests
      - name: Run FOF/CNF/TF1 conformance matrix
        run: lake exe conformance
      - name: Install E for differential checking
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y eprover
      - name: Record E version
        run: eprover --version
      - name: Parse typed fixtures
        run: python3 tools/test-corpus.py --typed test/fixtures
      - name: Differential syntax check
        run: python3 tools/test-differential.py test/fixtures/differential
      - name: Render demo
        run: lake exe demo > /tmp/tptp-demo.txt
      - run: test -s /tmp/tptp-demo.txt

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jonaprieto/precommit-lean/.github/actions/precommit@v0.1.5
        with:
          token: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
          skip: lean-axioms
      - run: git diff --check

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: jonaprieto/prop-pack
          ref: b038fc6f54841ad8179931b96eb94fdf61763384
          path: prop-pack
          persist-credentials: false
      - name: Configure private ecosystem access
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
        run: test -n "$GH_TOKEN"
      - name: Configure private ecosystem URL
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          build-args: corpus
      - name: Parse prop-pack corpus
        run: python3 tools/test-corpus.py prop-pack
      - name: Parse typed fixtures
        run: python3 tools/test-corpus.py --typed test/fixtures
