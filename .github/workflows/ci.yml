name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Cache elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake dependencies
        uses: actions/cache@v6
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lakefile.lean', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      - name: Configure private ecosystem access
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_READ_TOKEN || github.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          build-args: "TPTP TPTP.Properties demo tests corpus"
      - name: Audit proof axioms
        run: python3 scripts/check-axioms.py
      - name: Require total parser definitions
        run: '! rg -n "\\bpartial\\s+(def|theorem)\\b" TPTP/Parse.lean'
      - name: Run tests
        run: lake exe tests
      - name: Render demo
        run: lake exe demo > /tmp/tptp-demo.txt
      - run: test -s /tmp/tptp-demo.txt

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean style (100-col / trailing-ws / tabs)
        run: python3 scripts/style-check.py
      - run: git diff --check
